    <script>
    // Chatbot Configuration
    const WORKER_URL = 'https://late-moon-4f8a.sbmousavi-ces.workers.dev/';

    const toggleBtn = document.getElementById('chat-toggle');
    const closeBtn = document.getElementById('close-chat');
    const chatBox = document.getElementById('chat-box');
    const sendBtn = document.getElementById('send-btn');
    const userInput = document.getElementById('user-input');
    const messagesDiv = document.getElementById('chat-messages');

    // Toggle Chat Visibility
    toggleBtn.addEventListener('click', () => {
        chatBox.style.display = 'flex';
        toggleBtn.style.display = 'none';
        userInput.focus();
    });

    closeBtn.addEventListener('click', () => {
        chatBox.style.display = 'none';
        toggleBtn.style.display = 'block';
    });

    // Send Message Handlers
    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keypress', (e) => { 
        if (e.key === 'Enter') sendMessage(); 
    });

    async function sendMessage() {
        const message = userInput.value.trim();
        if (!message) return;

        // User Message Bubble
        messagesDiv.innerHTML += `<div class="msg-user"><span>${escapeHtml(message)}</span></div>`;
        userInput.value = '';
        messagesDiv.scrollTop = messagesDiv.scrollHeight;

        // Loading Indicator
        const loadingId = 'loading-' + Date.now();
        messagesDiv.innerHTML += `<div id="${loadingId}" class="loading-msg">Thinking...</div>`;
        messagesDiv.scrollTop = messagesDiv.scrollHeight;

        try {
            const response = await fetch(WORKER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: message })
            });
            
            const data = await response.json();
            document.getElementById(loadingId).remove();
            
            // Bot Response Bubble
            const replyText = data.reply || 'Sorry, I could not process that request.';
            messagesDiv.innerHTML += `<div class="msg-bot"><span>${escapeHtml(replyText)}</span></div>`;
        } catch (error) {
            document.getElementById(loadingId).remove();
            messagesDiv.innerHTML += `<div class="msg-bot"><span style="color:red;">️ Connection error. Please try again.</span></div>`;
        }
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    // Security Helper to prevent XSS
    function escapeHtml(text) {
        const map = {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
        };
        return text.replace(/[&<>"']/g, function(m) { return map[m]; });
    }
    </script>

            projectId: "bm-hub-84230",
            storageBucket: "bm-hub-84230.firebasestorage.app",
            messagingSenderId: "200738457599",
            appId: "1:200738457599:web:23277a9f7d0eee9bbec9ca",
            measurementId: "G-C1M79CP9RT"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;

        // =============================================
        // AUTH LOGIC
        // =============================================
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = {
                    uid: user.uid,
                    email: user.email,
                    name: user.displayName || user.email.split('@')[0]
                };
            } else {
                currentUser = null;
            }
            updateNavAuthUI();
        });

        function updateNavAuthUI() {
            const authBtn = document.getElementById('navAuthBtn');
            const userDropdown = document.getElementById('userDropdown');
            const userNameSpan = document.getElementById('navUserName');

            if (currentUser) {
                authBtn.style.display = 'none';
                userDropdown.classList.add('active');
                userNameSpan.textContent = currentUser.name.split(' ')[0];
            } else {
                authBtn.style.display = 'inline-flex';
                userDropdown.classList.remove('active');
                document.getElementById('userMenu').classList.remove('show');
            }
        }

        // Modal Controls
        const modalOverlay = document.getElementById('authModalOverlay');
        const authTabs = document.querySelectorAll('.auth-tab');
        const authForms = document.querySelectorAll('.auth-form');

        window.openModal = function(tab = 'signin') {
            modalOverlay.classList.add('active');
            switchTab(tab);
            document.body.style.overflow = 'hidden';
        }
        
        function closeModal() {
            modalOverlay.classList.remove('active');
            document.body.style.overflow = '';
            document.querySelectorAll('.auth-message').forEach(m => { m.className = 'auth-message'; m.textContent = ''; });
        }
        
        function switchTab(tabName) {
            authTabs.forEach(t => t.classList.toggle('active', t.dataset.tab === tabName));
            authForms.forEach(f => f.classList.remove('active'));
            document.getElementById(tabName === 'signin' ? 'signinForm' : 'signupForm').classList.add('active');
            document.querySelectorAll('.auth-message').forEach(m => { m.className = 'auth-message'; m.textContent = ''; });
        }

        document.getElementById('navAuthBtn').addEventListener('click', () => openModal('signin'));
        document.getElementById('authClose').addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });
        authTabs.forEach(tab => tab.addEventListener('click', () => switchTab(tab.dataset.tab)));

        document.getElementById('navUserBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            document.getElementById('userMenu').classList.toggle('show');
        });
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.user-dropdown')) document.getElementById('userMenu').classList.remove('show');
        });

        // Sign In
        document.getElementById('signinForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('signinEmail').value.trim();
            const password = document.getElementById('signinPassword').value;
            const msgDiv = document.getElementById('signinMessage');
            const btn = document.getElementById('btnSignin');

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';

            try {
                await signInWithEmailAndPassword(auth, email, password);
                msgDiv.className = 'auth-message success';
                msgDiv.textContent = '✓ Welcome back!';
                setTimeout(closeModal, 1000);
            } catch (error) {
                msgDiv.className = 'auth-message error';
                msgDiv.textContent = getFirebaseErrorMessage(error.code);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
            }
        });

        // Sign Up
        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;
            const msgDiv = document.getElementById('signupMessage');
            const btn = document.getElementById('btnSignup');

            if (password.length < 6) {
                msgDiv.className = 'auth-message error';
                msgDiv.textContent = 'Password must be at least 6 characters.';
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating account...';

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                await updateProfile(userCredential.user, { displayName: name });
                msgDiv.className = 'auth-message success';
                msgDiv.textContent = '✓ Account created!';
                setTimeout(closeModal, 1000);
            } catch (error) {
                msgDiv.className = 'auth-message error';
                msgDiv.textContent = getFirebaseErrorMessage(error.code);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
            }
        });

        document.getElementById('btnLogout').addEventListener('click', async () => {
            await signOut(auth);
            trackGoatEvent('/sign-out', 'User signed out from Hub');
            window.location.reload();
        });

        function getFirebaseErrorMessage(code) {
            switch(code) {
                case 'auth/email-already-in-use': return 'This email is already registered.';
                case 'auth/invalid-email': return 'Invalid email address.';
                case 'auth/user-not-found': return 'No account found with this email.';
                case 'auth/wrong-password': return 'Incorrect password.';
                case 'auth/weak-password': return 'Password is too weak.';
                default: return 'An error occurred. Please try again.';
            }
        }
    </script>
</body>
</html>
