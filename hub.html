        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);

        nav {
            position: fixed;
            top: 0;
            left: 0;

            height: var(--nav-height);
            background: var(--nav-bg);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);

            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5%;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--accent);
            font-weight: 700;
            font-size: 1.2rem;
        }

        .nav-logo img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid var(--accent);
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            list-style: none;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--accent);
        }

        /* ✅ SIGN IN BUTTON STYLE */
        .btn-signin {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 0.6rem 1.5rem;
            border: 1px solid var(--accent);
            border-radius: 50px;
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .btn-signin:hover {
            background: var(--accent);
            color: var(--bg-primary);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }

        /* Mobile Menu Toggle */
        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .bg-shapes {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; overflow: hidden;
        }
        .bg-shapes::before, .bg-shapes::after {
            content: ''; position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.15; animation: float 20s infinite ease-in-out;
        }
        .bg-shapes::before { width: 500px; height: 500px; background: var(--accent); top: -100px; right: -100px; }
        .bg-shapes::after { width: 600px; height: 600px; background: #4a90e2; bottom: -200px; left: -200px; animation-delay: -10s; }
        @keyframes float { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(50px, 50px) scale(1.1); } }

        /* COMING SOON CENTER STYLES */
        .coming-soon-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0 5%;
        }
        .coming-soon-text {
            font-family: 'Playfair Display', serif;
            font-size: clamp(3rem, 8vw, 7rem);
            font-weight: 900;
            line-height: 1.1;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }

        footer { background: var(--bg-secondary); padding: 2rem 5%; text-align: center; border-top: 1px solid var(--border); margin-top: auto; }
        footer p { color: var(--text-secondary); font-size: 0.9rem; }

        @media (max-width: 768px) {
            .nav-links { display: none; }
            .mobile-menu-btn { display: block; }
            .coming-soon-text { font-size: clamp(2.5rem, 12vw, 4rem); }
        }

        /* =============================================
           ✅ CUSTOM CHATBOT STYLES (QWEN INTEGRATION) - FIXED POSITION
           ============================================= */
           
        /* Wrapper for chat button positioning - Moved down to avoid overlap */
        #custom-chat-wrapper {
            position: fixed;
            top: 135px; /* ✅ Changed from 80px to 135px */
            left: 30px;
            z-index: 10000;
            display: flex;
            align-items: center;
            gap: 12px;
            pointer-events: none;
        }

        /* Chat Toggle Button */
        #chat-toggle {
            pointer-events: auto;
            padding: 10px 20px;
            background: var(--gradient);
            color: var(--bg-primary);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
            font-family: inherit;
            font-weight: 600;
            font-size: 0.9rem;
            z-index: 10001;
            transition: transform 0.2s ease;
        }

        #chat-toggle:hover {
            transform: scale(1.05);
        }

        /* Chat Box Window */
        #chat-box {
            display: none;
            position: fixed;
            top: 185px; /* ✅ Adjusted to match new wrapper position */
            left: 30px;
            width: 320px;
            height: 450px;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            flex-direction: column;
            font-family: 'Inter', Tahoma, Arial, sans-serif;
            z-index: 10002;
            overflow: hidden;
        }

        /* Chat Header */
        #chat-header {
            padding: 15px;
            background: var(--bg-primary);
            color: var(--accent);
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }

        #close-chat {
            background: none;
            border: none;
            color: var(--accent);
            font-size: 20px;
            cursor: pointer;
            padding: 0;
            line-height: 1;
        }

        /* Messages Area */
        #chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.6;
            background: #f9f9f9;
        }

        /* Input Area */
        #chat-input-area {
            padding: 10px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 8px;
            background: white;
        }

        #user-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            font-family: inherit;
            color: #333;
        }

        #send-btn {
            padding: 10px 16px;
            background: var(--accent);
            color: var(--bg-primary);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
        }

        /* Message Bubbles */
        .msg-user {
            margin: 8px 0;
            text-align: right;
        }
        .msg-user span {
            background: var(--accent);
            color: var(--bg-primary);
            padding: 8px 12px;
            border-radius: 12px 12px 0 12px;
            display: inline-block;
            max-width: 85%;
        }

        .msg-bot {
            margin: 8px 0;
            text-align: left;
        }
        .msg-bot span {
            background: #e9ecef;
            color: #333;
            padding: 8px 12px;
            border-radius: 12px 12px 12px 0;
            display: inline-block;
            max-width: 85%;
        }

        .loading-msg {
            margin: 8px 0;
            text-align: left;
            color: #888;
            font-style: italic;
            font-size: 13px;
        }

        /* Mobile Responsive for Chat */
        @media (max-width: 768px) {
            #custom-chat-wrapper {
                top: 130px; /* ✅ Adjusted for mobile stats bar */
                left: 20px;
            }
            #chat-box {
                width: calc(100% - 40px);
                left: 20px;
                top: 180px; /* ✅ Adjusted for mobile */
                height: 60vh;
            }
        }
    </style>
</head>

    <!-- ✅ CUSTOM CHATBOT INTERFACE (QWEN INTEGRATION) - REPOSITIONED -->
    <div id="custom-chat-wrapper">
        <button id="chat-toggle">💬 Chat</button>
    </div>

    <div id="chat-box">
        <div id="chat-header">
            <span>AI Assistant</span>
            <button id="close-chat">&times;</button>
        </div>
        <div id="chat-messages"></div>
        <div id="chat-input-area">
            <input type="text" id="user-input" placeholder="Type your question..." autocomplete="off">
            <button id="send-btn">Send</button>
        </div>
    </div>

    <script>
    // Chatbot Configuration
    const WORKER_URL = 'https://late-moon-4f8a.sbmousavi-ces.workers.dev/';

    const toggleBtn = document.getElementById('chat-toggle');
    const closeBtn = document.getElementById('close-chat');
    const chatBox = document.getElementById('chat-box');
    const sendBtn = document.getElementById('send-btn');
    const userInput = document.getElementById('user-input');
    const messagesDiv = document.getElementById('chat-messages');

    // Toggle Chat Visibility
    toggleBtn.addEventListener('click', () => {
        chatBox.style.display = 'flex';
        toggleBtn.style.display = 'none';
        userInput.focus();
    });

    closeBtn.addEventListener('click', () => {
        chatBox.style.display = 'none';
        toggleBtn.style.display = 'block';
    });

    // Send Message Handlers
    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keypress', (e) => { 
        if (e.key === 'Enter') sendMessage(); 
    });

    async function sendMessage() {
        const message = userInput.value.trim();
        if (!message) return;

        // User Message Bubble
        messagesDiv.innerHTML += `<div class="msg-user"><span>${escapeHtml(message)}</span></div>`;
        userInput.value = '';
        messagesDiv.scrollTop = messagesDiv.scrollHeight;

        // Loading Indicator
        const loadingId = 'loading-' + Date.now();
        messagesDiv.innerHTML += `<div id="${loadingId}" class="loading-msg">Thinking...</div>`;
        messagesDiv.scrollTop = messagesDiv.scrollHeight;

        try {
            const response = await fetch(WORKER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: message })
            });
            
            const data = await response.json();
            document.getElementById(loadingId).remove();
            
            // Bot Response Bubble
            const replyText = data.reply || 'Sorry, I could not process that request.';
            messagesDiv.innerHTML += `<div class="msg-bot"><span>${escapeHtml(replyText)}</span></div>`;
        } catch (error) {
            document.getElementById(loadingId).remove();
            messagesDiv.innerHTML += `<div class="msg-bot"><span style="color:red;">️ Connection error. Please try again.</span></div>`;
        }
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    // Security Helper to prevent XSS
    function escapeHtml(text) {
        const map = {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
        };
        return text.replace(/[&<>"']/g, function(m) { return map[m]; });
    }
    </script>
