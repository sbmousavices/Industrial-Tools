<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casio fx-4500PA | Behzad Mousavi</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-primary: #0a1628;
            --accent: #d4af37;
            --nav-height: 70px;
            --nav-bg: rgba(10, 10, 12, 0.95);
            --border: rgba(212, 175, 55, 0.2);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        body {
            background-color: var(--bg-primary);
            color: #e8eef7;
            min-height: 100vh;
            padding-top: calc(var(--nav-height) + 40px);
            overflow-x: hidden;
        }

        nav {
            position: fixed; top: 0; left: 0; width: 100%; height: var(--nav-height);
            background: var(--nav-bg); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border); z-index: 1000;
            display: flex; align-items: center; justify-content: space-between; padding: 0 5%;
        }
        .nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--accent); font-weight: 700; font-size: 1.2rem; }
        .nav-logo img { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--accent); }
        .nav-links { display: flex; gap: 0.8rem; list-style: none; align-items: center; }
        .nav-links a { color: #a0aec0; text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: color 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: var(--accent); }
        .btn-signin { display: inline-flex !important; align-items: center; gap: 8px; padding: 0.6rem 1.5rem !important; border: 1px solid var(--accent); border-radius: 50px; color: var(--accent) !important; text-decoration: none; font-weight: 600; font-size: 0.9rem; }
        .mobile-menu-btn { display: none; background: none; border: none; color: #e8eef7; font-size: 1.5rem; cursor: pointer; }

        .top-right-actions {
            position: fixed; top: calc(var(--nav-height) + 20px); right: 5%; z-index: 999;
        }
        .back-to-tools-btn {
            display: inline-flex; align-items: center; gap: 8px;
            height: 44px; padding: 0 1.2rem; border-radius: 50px; font-weight: 600; font-size: 0.9rem;
            text-decoration: none; background: var(--bg-primary); border: 1px solid var(--accent); color: var(--accent);
            transition: all 0.3s ease;
        }
        .back-to-tools-btn:hover { background: var(--accent); color: var(--bg-primary); }

        .main-layout {
            max-width: 380px; margin: 40px auto; padding: 0 20px;
        }

        /* CASIO BODY - Exact Physical Replica */
        .casio-body {
            background: linear-gradient(180deg, #2a2a2a 0%, #1a1a1a 100%);
            border-radius: 15px;
            padding: 18px 15px 22px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            border: 2px solid #0a0a0a;
        }

        .casio-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 10px; padding: 0 3px;
        }
        .casio-brand { 
            font-size: 1.2rem; font-weight: 900; color: #fff; letter-spacing: 2px;
        }
        .casio-model { 
            font-size: 0.75rem; color: #d4af37; font-weight: 700; font-style: italic;
        }
        .dot-matrix { 
            font-size: 0.65rem; color: #aaa; letter-spacing: 1px; font-weight: 600;
        }

        /* LCD DISPLAY - White/Light Background */
        .lcd-frame {
            background: #0a0a0a;
            border-radius: 5px;
            padding: 8px;
            margin-bottom: 15px;
            border: 2px solid #0a0a0a;
        }
        .lcd-screen {
            background: linear-gradient(180deg, #f5f5f0 0%, #e8e8e0 100%);
            border-radius: 3px;
            padding: 10px 12px;
            min-height: 75px;
            font-family: 'Share Tech Mono', monospace;
            position: relative;
        }
        .lcd-indicators {
            position: absolute; top: 3px; left: 6px; right: 6px;
            display: flex; justify-content: space-between;
            font-size: 0.6rem; color: #333; font-weight: 700;
        }
        .lcd-line {
            color: #1a1a1a;
            text-align: right;
            position: relative;
            z-index: 1;
        }
        .lcd-line.top { 
            font-size: 0.95rem; 
            min-height: 22px; 
            opacity: 0.8;
            letter-spacing: 0.5px;
        }
        .lcd-line.bottom { 
            font-size: 1.6rem; 
            font-weight: 700; 
            min-height: 30px;
            letter-spacing: 1px;
        }

        /* BUTTON GRID - 5 Columns */
        .btn-section { margin-bottom: 5px; }
        .btn-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            margin-bottom: 4px;
        }

        .calc-btn {
            position: relative;
            background: linear-gradient(180deg, #3a3a3a 0%, #2a2a2a 100%);
            border: 1px solid #1a1a1a;
            border-radius: 3px;
            color: #fff;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.08s;
            box-shadow: 0 2px 0 #0a0a0a, 0 3px 4px rgba(0,0,0,0.4);
            display: flex; align-items: center; justify-content: center;
            height: 38px;
            user-select: none;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }
        .calc-btn:active {
            transform: translateY(2px);
            box-shadow: 0 0 0 #0a0a0a, inset 0 2px 4px rgba(0,0,0,0.6);
        }

        /* Small top row buttons */
        .calc-btn.tiny {
            height: 28px;
            font-size: 0.6rem;
            font-weight: 500;
        }

        /* Shift Labels (Yellow) */
        .calc-btn .shift-label {
            position: absolute; 
            top: 1px; left: 2px;
            font-size: 0.45rem; 
            color: #f4d06f; 
            font-weight: 700;
        }
        
        /* Alpha Labels (Red/Pink) */
        .calc-btn .alpha-label {
            position: absolute; 
            top: 1px; right: 2px;
            font-size: 0.45rem; 
            color: #e74c3c; 
            font-weight: 700;
        }

        /* Button Colors - Exact Match to Real Calculator */
        .calc-btn.shift-yellow {
            background: linear-gradient(180deg, #f4d06f 0%, #d4af37 100%);
            color: #1a1a1a;
            font-weight: 700;
        }
        .calc-btn.alpha-red {
            background: linear-gradient(180deg, #e74c3c 0%, #c0392b 100%);
            color: #fff;
            font-weight: 700;
        }
        .calc-btn.del-gray {
            background: linear-gradient(180deg, #666 0%, #555 100%);
            color: #fff;
        }
        .calc-btn.ac-gray {
            background: linear-gradient(180deg, #666 0%, #555 100%);
            color: #fff;
        }
        .calc-btn.exe-blue {
            background: linear-gradient(180deg, #3498db 0%, #2874a6 100%);
            color: #fff;
            font-weight: 700;
        }
        .calc-btn.number {
            background: linear-gradient(180deg, #4a4a4a 0%, #3a3a3a 100%);
            color: #fff;
            font-size: 0.85rem;
        }
        .calc-btn.function {
            background: linear-gradient(180deg, #3a3a3a 0%, #2a2a2a 100%);
            color: #fff;
            font-size: 0.7rem;
        }

        @media (max-width: 900px) {
            .nav-links { display: none; }
            .mobile-menu-btn { display: block; }
            .top-right-actions { right: 20px; top: calc(var(--nav-height) + 10px); }
            .calc-btn { height: 34px; font-size: 0.7rem; }
            .calc-btn.tiny { height: 24px; font-size: 0.55rem; }
            .lcd-line.bottom { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="https://sbmousavices.github.io/Industrial-Tools/EnglishInfo.html" class="nav-logo">
            <img src="https://sbmousavices.github.io/Industrial-Tools/icon-192.png" alt="BM Planning Logo">
            <span>Home</span>
        </a>
        <ul class="nav-links">
            <li><a href="https://sbmousavices.github.io/Resume/Resume_Builder_English.html">Resume Builder</a></li>
            <li><a href="https://sbmousavices.github.io/Theme/index.html">Web Design</a></li>
            <li><a href="https://sbmousavices.github.io/NFT/">NFT Gallery</a></li>
            <li><a href="https://sbmousavices.github.io/Industrial-Tools/" class="active">Products</a></li>
            <li><a href="https://sbmousavices.github.io/Articles/">Articles</a></li>
            <li><a href="https://sbmousavices.github.io/Industrial-Tools/Community.html">Community</a></li>
            <li><a href="https://sbmousavices.github.io/Community-Hub/hub.html">Hub</a></li>
            <li><a href="https://sbmousavices.github.io/Industrial-Tools/EnglishInfo.html#contact">Contact</a></li>
            <li><a href="https://sbmousavices.github.io/Industrial-Tools/EnglishInfo.html" class="btn-signin"><i class="fas fa-user"></i> Sign In</a></li>
        </ul>
        <button class="mobile-menu-btn"><i class="fas fa-bars"></i></button>
    </nav>

    <div class="top-right-actions">
        <a href="https://sbmousavices.github.io/Industrial-Tools/tools.html" class="back-to-tools-btn">
            <i class="fas fa-arrow-left"></i> Back to Eng. Tools
        </a>
    </div>

    <div class="main-layout">
        <div class="casio-body">
            <div class="casio-header">
                <div>
                    <div class="casio-brand">CASIO</div>
                    <div class="casio-model">fx-4500PA</div>
                </div>
                <div class="dot-matrix">DOT MATRIX LCD</div>
            </div>

            <div class="lcd-frame">
                <div class="lcd-screen">
                    <div class="lcd-indicators">
                        <span id="mode-ind">COMP</span>
                        <span id="deg-ind">D</span>
                        <span id="shift-ind"></span>
                        <span id="mem-ind">M</span>
                    </div>
                    <div class="lcd-line top" id="disp-top"></div>
                    <div class="lcd-line bottom" id="disp-bottom">0</div>
                </div>
            </div>

            <!-- Row 1: Tiny mode buttons -->
            <div class="btn-section">
                <div class="btn-row">
                    <button class="calc-btn tiny" onclick="setMode('COMP')">MODE</button>
                    <button class="calc-btn tiny" onclick="insertFunc('defm')">Defm</button>
                    <button class="calc-btn tiny" onclick="insertFunc('expm')">EXPM</button>
                    <button class="calc-btn tiny" onclick="clearAll()">CLR</button>
                    <button class="calc-btn tiny" onclick="insertFunc('p03')">P0~P3</button>
                </div>
            </div>

            <!-- Row 2: More tiny buttons -->
            <div class="btn-section">
                <div class="btn-row">
                    <button class="calc-btn tiny" onclick="insertFunc('deg')">Deg</button>
                    <button class="calc-btn tiny" onclick="insertFunc('rad')">Rad</button>
                    <button class="calc-btn tiny" onclick="insertFunc('gra')">Gra</button>
                    <button class="calc-btn tiny" onclick="insertFunc('fix')">Fix</button>
                    <button class="calc-btn tiny" onclick="insertFunc('sci')">Sci</button>
                </div>
            </div>

            <!-- Row 3: SHIFT, ALPHA, and function buttons -->
            <div class="btn-section">
                <div class="btn-row">
                    <button class="calc-btn shift-yellow tiny" onclick="toggleShift()">SHIFT</button>
                    <button class="calc-btn alpha-red tiny" onclick="toggleAlpha()">ALPHA</button>
                    <button class="calc-btn tiny" onclick="insertFunc('calc')">CALC</button>
                    <button class="calc-btn tiny" onclick="insertFunc('solve')">SOLVE</button>
                    <button class="calc-btn tiny" onclick="toggleMode()">MODE</button>
                </div>
            </div>

            <!-- Row 4: Scientific functions -->
            <div class="btn-section">
                <div class="btn-row">
                    <button class="calc-btn function" onclick="insertFunc('sin')">
                        <span class="shift-label">sin⁻¹</span>sin
                    </button>
                    <button class="calc-btn function" onclick="insertFunc('cos')">
                        <span class="shift-label">cos⁻¹</span>cos
                    </button>
                    <button class="calc-btn function" onclick="insertFunc('tan')">
                        <span class="shift-label">tan⁻¹</span>tan
                    </button>
                    <button class="calc-btn function" onclick="insertFunc('log')">
                        <span class="shift-label">10</span>log
                    </button>
                    <button class="calc-btn function" onclick="insertFunc('ln')">
                        <span class="shift-label">eˣ</span>ln
                    </button>
                </div>
            </div>

            <!-- Row 5: More functions -->
            <div class="btn-section">
                <div class="btn-row">
                    <button class="calc-btn function" onclick="insertVal('(')">
                        <span class="shift-label">x⁻¹</span>(
                    </button>
                    <button class="calc-btn function" onclick="insertVal(')')">
                        <span class="shift-label">n!</span>)
                    </button>
                    <button class="calc-btn function" onclick="insertVal('^')">
                        <span class="shift-label">ˣ√</span>x^y
                    </button>
                    <button class="calc-btn function" onclick="insertFunc('hyp')">
                        <span class="shift-label">hyp¹</span>hyp
                    </button>
                    <button class="calc-btn function" onclick="insertFunc('sqrt')">
                        <span class="shift-label">x²</span>√
                    </button>
                </div>
            </div>

            <!-- Row 6: Numbers 7-9, DEL, AC -->
            <div class="btn-section">
                <div class="btn-row">
                    <button class="calc-btn number" onclick="insertVal('7')">
                        <span class="alpha-label">S</span>7
                    </button>
                    <button class="calc-btn number" onclick="insertVal('8')">
                        <span class="alpha-label">T</span>8
                    </button>
                    <button class="calc-btn number" onclick="insertVal('9')">
                        <span class="alpha-label">U</span>9
                    </button>
                    <button class="calc-btn del-gray" onclick="deleteChar()">DEL</button>
                    <button class="calc-btn ac-gray" onclick="clearAll()">AC</button>
                </div>
            </div>

            <!-- Row 7: Numbers 4-6, ×, ÷ -->
            <div class="btn-section">
                <div class="btn-row">
                    <button class="calc-btn number" onclick="insertVal('4')">
                        <span class="alpha-label">J</span>4
                    </button>
                    <button class="calc-btn number" onclick="insertVal('5')">
                        <span class="alpha-label">K</span>5
                    </button>
                    <button class="calc-btn number" onclick="insertVal('6')">
                        <span class="alpha-label">L</span>6
                    </button>
                    <button class="calc-btn number" onclick="insertVal('*')">
                        <span class="alpha-label">M</span>×
                    </button>
                    <button class="calc-btn number" onclick="insertVal('/')">
                        <span class="alpha-label">V</span>÷
                    </button>
                </div>
            </div>

            <!-- Row 8: Numbers 1-3, +, - -->
            <div class="btn-section">
                <div class="btn-row">
                    <button class="calc-btn number" onclick="insertVal('1')">
                        <span class="alpha-label">A</span>1
                    </button>
                    <button class="calc-btn number" onclick="insertVal('2')">
                        <span class="alpha-label">B</span>2
                    </button>
                    <button class="calc-btn number" onclick="insertVal('3')">
                        <span class="alpha-label">C</span>3
                    </button>
                    <button class="calc-btn number" onclick="insertVal('+')">
                        <span class="alpha-label">O</span>+
                    </button>
                    <button class="calc-btn number" onclick="insertVal('-')">
                        <span class="alpha-label">N</span>-
                    </button>
                </div>
            </div>

            <!-- Row 9: 0, ., EXP, Ans, π -->
            <div class="btn-section">
                <div class="btn-row">
                    <button class="calc-btn number" onclick="insertVal('0')">
                        <span class="alpha-label">D</span>0
                    </button>
                    <button class="calc-btn number" onclick="insertVal('.')">
                        <span class="alpha-label">E</span>.
                    </button>
                    <button class="calc-btn number" onclick="insertVal('EXP')">
                        <span class="alpha-label">F</span>EXP
                    </button>
                    <button class="calc-btn number" onclick="insertVal('Ans')">Ans</button>
                    <button class="calc-btn number" onclick="insertVal('π')">
                        <span class="shift-label">e</span>π
                    </button>
                </div>
            </div>

            <!-- Row 10: STO, RCL, M+, M-, EXE -->
            <div class="btn-section">
                <div class="btn-row">
                    <button class="calc-btn function" onclick="insertFunc('sto')">STO</button>
                    <button class="calc-btn function" onclick="memoryRecall()">RCL</button>
                    <button class="calc-btn function" onclick="memoryAdd()">M+</button>
                    <button class="calc-btn function" onclick="memorySub()">M-</button>
                    <button class="calc-btn exe-blue" onclick="calculate()">EXE</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // CALCULATOR LOGIC
        let expression = '';
        let lastAnswer = 0;
        let memory = 0;
        let isDegree = true;
        let isShift = false;
        let isAlpha = false;
        let currentMode = 'COMP';
        let isNewCalc = false;

        const dispTop = document.getElementById('disp-top');
        const dispBottom = document.getElementById('disp-bottom');
        const modeInd = document.getElementById('mode-ind');
        const degInd = document.getElementById('deg-ind');
        const shiftInd = document.getElementById('shift-ind');
        const memInd = document.getElementById('mem-ind');

        function factorial(n) {
            if (n < 0) return NaN;
            if (n === 0 || n === 1) return 1;
            let result = 1;
            for (let i = 2; i <= n; i++) result *= i;
            return result;
        }

        function setMode(mode) {
            currentMode = mode;
            modeInd.innerText = mode;
        }

        function toggleShift() {
            isShift = !isShift;
            isAlpha = false;
            shiftInd.innerText = isShift ? 'S' : '';
        }

        function toggleAlpha() {
            isAlpha = !isAlpha;
            isShift = false;
            shiftInd.innerText = isAlpha ? 'A' : '';
        }

        function toggleMode() {
            const modes = ['COMP', 'SD', 'REG', 'BASE'];
            const idx = modes.indexOf(currentMode);
            currentMode = modes[(idx + 1) % modes.length];
            modeInd.innerText = currentMode;
        }

        function insertVal(val) {
            if (isNewCalc) {
                if (/[\d.π]/.test(val) || val === 'Ans' || val === '(') {
                    expression = '';
                    dispTop.innerText = '';
                } else if (/[\+\-\*\/\^]/.test(val)) {
                    expression = 'Ans' + val;
                }
                isNewCalc = false;
            }
            expression += val;
            updateDisplay();
        }

        function insertFunc(func) {
            if (isShift) {
                const shiftFuncs = {
                    'sin': 'asin', 'cos': 'acos', 'tan': 'atan',
                    'log': '10^', 'ln': 'e^', 'sqrt': '^2', 'hyp': 'ahyp'
                };
                func = shiftFuncs[func] || func;
                isShift = false;
                shiftInd.innerText = '';
            }
            if (isNewCalc) {
                expression = '';
                dispTop.innerText = '';
                isNewCalc = false;
            }
            expression += func + '(';
            updateDisplay();
        }

        function updateDisplay() {
            let formatted = expression
                .replace(/\*/g, '×').replace(/\//g, '÷')
                .replace(/sqrt/g, '√').replace(/asin/g, 'sin⁻¹')
                .replace(/acos/g, 'cos⁻¹').replace(/atan/g, 'tan⁻¹');
            dispTop.innerText = formatted;
        }

        function deleteChar() {
            if (isNewCalc) { clearAll(); return; }
            expression = expression.slice(0, -1);
            updateDisplay();
        }

        function clearAll() {
            expression = '';
            dispTop.innerText = '';
            dispBottom.innerText = '0';
            isNewCalc = false;
        }

        function memoryAdd() {
            try {
                let val = parseFloat(dispBottom.innerText);
                if (!isNaN(val)) {
                    memory += val;
                    memInd.style.opacity = '1';
                }
            } catch(e) {}
        }

        function memorySub() {
            try {
                let val = parseFloat(dispBottom.innerText);
                if (!isNaN(val)) {
                    memory -= val;
                }
            } catch(e) {}
        }

        function memoryRecall() {
            if (isNewCalc) { expression = ''; isNewCalc = false; }
            expression += memory.toString();
            updateDisplay();
        }

        function evaluate(expr) {
            let jsExpr = expr
                .replace(/π/g, 'Math.PI')
                .replace(/Ans/g, lastAnswer)
                .replace(/sin\(/g, 'Math.sin(' + (isDegree ? 'Math.PI/180*' : ''))
                .replace(/cos\(/g, 'Math.cos(' + (isDegree ? 'Math.PI/180*' : ''))
                .replace(/tan\(/g, 'Math.tan(' + (isDegree ? 'Math.PI/180*' : ''))
                .replace(/asin\(/g, (isDegree ? '180/Math.PI*' : '') + 'Math.asin(')
                .replace(/acos\(/g, (isDegree ? '180/Math.PI*' : '') + 'Math.acos(')
                .replace(/atan\(/g, (isDegree ? '180/Math.PI*' : '') + 'Math.atan(')
                .replace(/log\(/g, 'Math.log10(')
                .replace(/ln\(/g, 'Math.log(')
                .replace(/sqrt\(/g, 'Math.sqrt(')
                .replace(/10\^\(/g, 'Math.pow(10,')
                .replace(/e\^\(/g, 'Math.exp(')
                .replace(/\^/g, '**')
                .replace(/(\d+)!/g, 'factorial($1)');

            try {
                let result = Function('factorial', 'return ' + jsExpr)(factorial);
                if (typeof result === 'number') {
                    if (!Number.isInteger(result)) result = parseFloat(result.toFixed(10));
                    if (Math.abs(result) > 1e10 || (Math.abs(result) < 1e-7 && result !== 0)) {
                        result = result.toExponential(6);
                    }
                }
                return result;
            } catch (e) {
                return 'ERROR';
            }
        }

        function calculate() {
            if (!expression) return;
            let result = evaluate(expression);
            dispBottom.innerText = result;
            dispTop.innerText = expression + '=';
            if (result !== 'ERROR') {
                lastAnswer = result;
                isNewCalc = true;
            }
        }

        // Keyboard support
        document.addEventListener('keydown', (e) => {
            const key = e.key;
            if (/[\d.]/.test(key)) insertVal(key);
            if (['+', '-', '*', '/', '(', ')', '^'].includes(key)) insertVal(key);
            if (key === 'Enter') { e.preventDefault(); calculate(); }
            if (key === 'Backspace') deleteChar();
            if (key === 'Escape') clearAll();
        });
    </script>
</body>
